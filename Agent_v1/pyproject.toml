[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamate-agent"
version = "1.0.0"
description = "Offline Vietnamese structured-data agent for Kaggle"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.2,<3", "sqlglot>=26,<31", "pydantic>=2.10,<3", "PyYAML>=6,<7", "openpyxl>=3.1,<4", "simplejson>=3.19,<5", "pandas>=2.2,<4"]

[project.optional-dependencies]
llm = ["transformers>=5.3,<6", "accelerate>=1.3,<2", "bitsandbytes>=0.45,<1", "safetensors>=0.5"]
test = ["pytest>=8,<10"]

[project.scripts]
datamate = "datamate.cli:main"

[tool.setuptools.packages.find]
include = ["datamate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

